name: Publish

# Releases are published from here with npm trusted publishing (OIDC),
# so no long-lived npm token lives in this repository.
# Setup: npmjs.com -> package settings -> Trusted Publisher ->
#   GitHub Actions -> RetroNyym / deaddeps / publish.yml
#
# npm drops support for 2FA-bypass tokens in January 2027; this is the
# supported path after that date.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required for OIDC token exchange
      contents: read
    steps:
      - uses: actions/checkout@v6

      # No registry-url here on purpose: setup-node would write
      # `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` to .npmrc, and
      # with no token set npm treats auth as configured and skips the OIDC
      # exchange (ENEEDAUTH/E404 - npm/documentation#1960). deaddeps has no
      # private dependencies, so the default registry is all we need.
      - uses: actions/setup-node@v6
        with:
          node-version: '24' # bundles npm >= 11.5.1, required for OIDC
          package-manager-cache: false # never cache a release build

      # npm < 11.5.1 never attempts the OIDC token exchange at all.
      - name: Check npm supports trusted publishing (>= 11.5.1)
        run: |
          v="$(npm -v)"
          echo "npm $v"
          if [ "$(printf '%s\n' 11.5.1 "$v" | sort -V | head -n1)" != "11.5.1" ]; then
            echo "npm $v is older than 11.5.1 - OIDC publish would fail." >&2
            exit 1
          fi

      - name: Install
        run: npm ci

      - name: Tests
        run: npm test

      - name: Check whether the version is already on the registry
        id: published
        shell: bash
        run: |
          v="$(node -p "require('./package.json').version")"
          if npm view "deaddeps@$v" version >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "deaddeps@$v is already published - nothing to do."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "deaddeps@$v will be published."
          fi

      - name: npm publish (OIDC, provenance is generated automatically)
        if: steps.published.outputs.skip == 'false'
        run: npm publish
