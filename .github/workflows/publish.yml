name: Publish

# Releases are published from here with npm trusted publishing (OIDC),
# so no long-lived npm token lives in this repository.
# Setup: npmjs.com -> package settings -> Trusted Publisher ->
#   GitHub Actions -> RetroNyym / deaddeps / publish.yml
#
# npm drops support for 2FA-bypass tokens in January 2027; this is the
# supported path after that date.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required for OIDC token exchange
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22.14'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false # never cache a release build

      - name: Install
        run: npm ci

      - name: Tests
        run: npm test

      - name: Check whether the version is already on the registry
        id: published
        shell: bash
        run: |
          v="$(node -p "require('./package.json').version")"
          if npm view "deaddeps@$v" version >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "deaddeps@$v is already published - nothing to do."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "deaddeps@$v will be published."
          fi

      - name: npm publish (OIDC, provenance is generated automatically)
        if: steps.published.outputs.skip == 'false'
        run: npm publish
